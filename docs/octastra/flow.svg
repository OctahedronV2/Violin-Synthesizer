<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" width="1000" role="img" aria-label="Signal flow of one section"><style>
svg{--surface:#f6f5f2;--box:#ffffff;--rule:#cfc9bf;--ink:#1f1c19;--muted:#655d55;--accent:#97591c;--accent-soft:#f1e6d6;
--vln1:#a8621f;--vln2:#9a7a12;--vla:#5d7431;--vc:#a4473a;--cb:#3e6a8c}
.t{fill:var(--ink);font-family:Arial,Helvetica,sans-serif}.m{fill:var(--muted);font-family:Arial,Helvetica,sans-serif}
.bx{fill:var(--box);stroke:var(--rule)}.ln{stroke:var(--muted);fill:none}
</style><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker></defs><rect x="0" y="0" width="1000" height="214" rx="10" style="fill:var(--accent-soft)"/><text x="16" y="26" class="m" font-size="12.5" text-anchor="start" font-weight="600">PER PLAYER · oversampled, at least 176.4 kHz</text><rect x="0" y="228" width="1000" height="172" rx="10" style="fill:var(--surface)"/><text x="16" y="254" class="m" font-size="12.5" text-anchor="start" font-weight="600">PER SECTION · host rate</text><rect x="16" y="96" width="96" height="48" rx="6" class="bx" /><text x="64" y="116" class="t" font-size="14" text-anchor="middle" font-weight="600">MIDI</text><text x="64" y="134" class="m" font-size="12.5" text-anchor="middle" font-weight="400">channel 3</text><line x1="114" y1="120" x2="140" y2="120" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="142" y="86" width="130" height="68" rx="6" class="bx" /><text x="207" y="110" class="t" font-size="14" text-anchor="middle" font-weight="600">Divisi allocator</text><text x="207" y="128" class="m" font-size="12.5" text-anchor="middle" font-weight="400">notes → players,</text><text x="207" y="144" class="m" font-size="12.5" text-anchor="middle" font-weight="400">onset spread</text><line x1="274" y1="120" x2="300" y2="64" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="302" y="44" width="420" height="40" rx="6" class="bx" /><text x="314" y="69" class="t" font-size="13.5" text-anchor="start" font-weight="600">Player 1</text><text x="378" y="69" class="m" font-size="12.5" text-anchor="start" font-weight="400">bow + strings → tone offset → seat delay, level, air → pan</text><line x1="724" y1="64" x2="752" y2="110" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><line x1="274" y1="120" x2="300" y2="116" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="302" y="96" width="420" height="40" rx="6" class="bx" /><text x="314" y="121" class="t" font-size="13.5" text-anchor="start" font-weight="600">Player 2</text><text x="378" y="121" class="m" font-size="12.5" text-anchor="start" font-weight="400">bow + strings → tone offset → seat delay, level, air → pan</text><line x1="724" y1="116" x2="752" y2="110" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><line x1="274" y1="120" x2="300" y2="168" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="302" y="148" width="420" height="40" rx="6" class="bx" /><text x="314" y="173" class="t" font-size="13.5" text-anchor="start" font-weight="600">Player n</text><text x="378" y="173" class="m" font-size="12.5" text-anchor="start" font-weight="400">bow + strings → tone offset → seat delay, level, air → pan</text><line x1="724" y1="168" x2="752" y2="110" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><text x="512" y="202" class="m" font-size="12" text-anchor="middle" font-weight="400">up to 16 players; idle strings and switched-off desks skipped</text><rect x="754" y="70" width="130" height="80" rx="8" class="bx" style="stroke:var(--accent)"/><text x="819" y="98" class="t" font-size="14" text-anchor="middle" font-weight="600">Σ body buses</text><text x="819" y="116" class="m" font-size="12.5" text-anchor="middle" font-weight="400">2–3 buses × L, R</text><text x="819" y="132" class="m" font-size="12.5" text-anchor="middle" font-weight="400">players summed</text><path d="M819 152 L819 190 L60 190 L60 286" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="16" y="288" width="130" height="60" rx="6" class="bx" /><text x="81.0" y="313" class="t" font-size="14" text-anchor="middle" font-weight="600">Decimate</text><text x="81.0" y="331" class="m" font-size="12.5" text-anchor="middle" font-weight="400">per bus, not per player</text><rect x="176" y="288" width="150" height="60" rx="6" class="bx" /><text x="251.0" y="313" class="t" font-size="14" text-anchor="middle" font-weight="600">Body convolution</text><text x="251.0" y="331" class="m" font-size="12.5" text-anchor="middle" font-weight="400">measured body per bus</text><line x1="148" y1="318" x2="174" y2="318" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="356" y="288" width="170" height="60" rx="6" class="bx" /><text x="441.0" y="313" class="t" font-size="14" text-anchor="middle" font-weight="600">Sympathetic strings</text><text x="441.0" y="331" class="m" font-size="12.5" text-anchor="middle" font-weight="400">open-string resonance</text><line x1="328" y1="318" x2="354" y2="318" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="556" y="288" width="170" height="60" rx="6" class="bx" /><text x="641.0" y="313" class="t" font-size="14" text-anchor="middle" font-weight="600">Section bus</text><text x="641.0" y="331" class="m" font-size="12.5" text-anchor="middle" font-weight="400">mute, width, early refl.</text><line x1="528" y1="318" x2="554" y2="318" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><line x1="728" y1="308" x2="790" y2="284" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><line x1="728" y1="328" x2="790" y2="352" class="ln" stroke-width="1.3" marker-end="url(#ah)"/><rect x="792" y="262" width="190" height="40" rx="6" class="bx" /><text x="887" y="287" class="t" font-size="13.5" text-anchor="middle" font-weight="400">Section out (stem)</text><rect x="792" y="334" width="190" height="40" rx="6" class="bx" /><text x="887" y="359" class="t" font-size="13.5" text-anchor="middle" font-weight="400">Shared room tail → Main</text></svg>