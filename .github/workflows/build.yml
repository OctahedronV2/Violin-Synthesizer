name: Build

# What runs when (docs/CI.md has the full picture):
# - Pull requests and pushes to main build and test on Windows only, the
#   platform the plugin is tried on. Linux and macOS builds run when started by
#   hand (Actions > Build > Run workflow), for version tags, and on pull
#   requests with the "all-platforms" label.
# - Each job runs only when files it covers changed (the "changes" job), so a
#   research-only change skips the C++ builds and a C++ change skips pytest.
# - Compiles go through sccache, stored in the GitHub Actions cache, so JUCE
#   and unchanged sources are not rebuilt on every run.
# A newer push to a pull request cancels its older run, and Markdown-only
# changes skip CI.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, windows]
        default: all
      release:
        description: Publish a release of this commit, tagged v<version from CMakeLists.txt> (main only; builds all platforms)
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Adding a label starts a run of its own; keep it from cancelling the run
  # for the latest push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUILD_TYPE: Release
  BUILD_DIR: build
  PLUGINVAL_VERSION: v1.0.4
  VST3_SDK_TAG: v3.8.1_build_84
  ARTEFACTS: build/Octavio_artefacts/Release
  PRODUCT_NAME: Octavio
  # Octavio 2 (octavio2/) builds beside Octavio 1 and is validated and packaged the same way.
  ARTEFACTS2: build/octavio2/Octavio2_artefacts/Release
  PRODUCT_NAME2: Octavio 2
  # The label that adds Linux and macOS to a pull request's builds.
  ALL_PLATFORMS_LABEL: all-platforms
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      cpp: ${{ steps.plan.outputs.cpp }}
      bench: ${{ steps.plan.outputs.bench }}
      research: ${{ steps.plan.outputs.research }}
      format: ${{ steps.plan.outputs.format }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5

      # Which areas a job covers. The workflow file is in every list, so a CI
      # change re-runs everything.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - .github/workflows/build.yml
              - CMakeLists.txt
              - cmake/**
              - source/**
              - octavio2/**
              - tests/**
              - resources/**
              - third_party/**
            bench:
              - .github/workflows/build.yml
              - CMakeLists.txt
              - cmake/**
              - source/**
              - tests/CMakeLists.txt
              - tests/bench/**
              - resources/**
              - third_party/**
              - docs/benchmarks/**
            research:
              - .github/workflows/build.yml
              - research/**
            format:
              - .github/workflows/build.yml
              - .clang-format
              - "**/*.h"
              - "**/*.cpp"

      - name: Decide what runs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
          DISPATCH_RELEASE: ${{ inputs.release }}
          CPP: ${{ steps.filter.outputs.cpp }}
          BENCH: ${{ steps.filter.outputs.bench }}
          RESEARCH: ${{ steps.filter.outputs.research }}
          FORMAT: ${{ steps.filter.outputs.format }}
        run: |
          all_platforms=false
          case "$EVENT" in
            workflow_dispatch)
              # A run started by hand checks everything.
              CPP=true BENCH=true RESEARCH=true FORMAT=true
              [ "$DISPATCH_PLATFORMS" = all ] && all_platforms=true
              [ "$DISPATCH_RELEASE" = true ] && all_platforms=true
              ;;
            push)
              if [[ "$REF" == refs/tags/* ]]; then
                CPP=true BENCH=true RESEARCH=true FORMAT=true all_platforms=true
              fi
              ;;
            pull_request)
              if echo "$PR_LABELS" | grep -q "\"$ALL_PLATFORMS_LABEL\""; then
                all_platforms=true
              fi
              if [ "$ACTION" = labeled ]; then
                if [ "$ADDED_LABEL" = "$ALL_PLATFORMS_LABEL" ]; then
                  # The push before the label already checked Windows and the
                  # Linux-only jobs; this run adds the other platforms.
                  BENCH=false RESEARCH=false FORMAT=false
                else
                  CPP=false BENCH=false RESEARCH=false FORMAT=false all_platforms=false
                fi
              fi
              ;;
          esac

          platforms='{"name":"Windows","os":"windows-2022"}'
          if [ "$all_platforms" = true ]; then
            platforms+=',{"name":"Linux","os":"ubuntu-24.04"},{"name":"macOS","os":"macos-15"}'
            if [ "$ACTION" = labeled ]; then
              platforms='{"name":"Linux","os":"ubuntu-24.04"},{"name":"macOS","os":"macos-15"}'
            fi
          fi
          [ "$CPP" = true ] || platforms=''

          {
            echo "cpp=$CPP"
            echo "bench=$BENCH"
            echo "research=$RESEARCH"
            echo "format=$FORMAT"
            echo "platforms=[$platforms]"
          } | tee -a "$GITHUB_OUTPUT"

  format:
    needs: changes
    if: needs.changes.outputs.format == 'true'
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          clang-format-18 --version
          git ls-files '*.h' '*.cpp' | xargs clang-format-18 --dry-run --Werror

  research:
    needs: changes
    if: needs.changes.outputs.research == 'true'
    name: Research model tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  rtsan:
    needs: changes
    if: needs.changes.outputs.cpp == 'true' && github.event.action != 'labeled'
    name: RealtimeSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Clang 20 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-20 libclang-rt-20-dev ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DVIOLINSYNTH_ENABLE_RTSAN=ON

      - name: Build tests
        run: cmake --build "$BUILD_DIR" --target ViolinSynthTests --parallel 4

      # processBlock and the engine are marked nonblocking: any allocation,
      # lock or system call reached from them stops the run with a stack trace.
      - name: Tests under RealtimeSanitizer
        run: "$BUILD_DIR/tests/ViolinSynthTests"

      - name: Compile cache statistics
        if: always()
        run: sccache --show-stats

  # docs/PHASE7.md, step 7.0. Instruction counts are stable on shared runners
  # where timings are not, so this is the CPU regression check. It builds only
  # the benchmark, and only when code it measures (or the baseline) changed.
  callgrind:
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    name: Benchmark (instruction counts)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build valgrind \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build the benchmark
        run: cmake --build "$BUILD_DIR" --target ViolinSynthBench --parallel 4

      - name: Instruction counts against the baseline
        run: |
          mkdir -p callgrind
          valgrind --tool=callgrind --instr-atstart=no --callgrind-out-file=callgrind/callgrind.out.%p \
            "$BUILD_DIR/tests/ViolinSynthBench" --ci --seconds 1 --json callgrind/bench.json > callgrind/run.log 2>&1 \
            || { cat callgrind/run.log; exit 1; }
          python3 tests/bench/instructions.py callgrind

      - name: Compile cache statistics
        if: always()
        run: sccache --show-stats

  build:
    needs: changes
    if: needs.changes.outputs.platforms != '[]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.platforms) }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.9

      # Ninja instead of the Visual Studio generator, so sccache can cache
      # MSVC's compiles and all four cores stay busy.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: ninja --version || choco install ninja --no-progress -y

      # Link-time optimisation makes every link redo code generation for all
      # of JUCE (about 4 of the 6 build minutes on Windows, and the compile
      # cache can't help with it), so pull requests build without it. Builds
      # of main, tags and runs started by hand keep it, like a release.
      - name: Configure
        env:
          LTO: ${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}
        run: |
          args=(-G Ninja -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DVIOLINSYNTH_ENABLE_LTO="$LTO")
          case "$RUNNER_OS" in
            macOS)   args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
            Windows) args+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl) ;;
          esac
          cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" "${args[@]}"

      - name: Build
        run: cmake --build "$BUILD_DIR" --config "$BUILD_TYPE" --parallel 4

      # Where the build time went, to guide further CI tuning.
      - name: Slowest build steps
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          "$py" - "$BUILD_DIR/.ninja_log" <<'EOF'
          import sys
          rows = [l.split("\t") for l in open(sys.argv[1]) if not l.startswith("#")]
          rows = sorted(((int(r[1]) - int(r[0])) / 1000, r[3]) for r in rows if len(r) >= 4)[-12:]
          for secs, path in reversed(rows):
              print(f"{secs:7.1f}s  {path}")
          EOF

      - name: Unit tests
        run: ctest --test-dir "$BUILD_DIR" --build-config "$BUILD_TYPE" --output-on-failure

      # Timings on shared runners are only a rough guide, so this step never
      # fails; the Callgrind job is the check.
      - name: Benchmarks (timings, for information)
        run: |
          bench=$(find "$BUILD_DIR/tests" -name 'ViolinSynthBench' -o -name 'ViolinSynthBench.exe' | head -n 1)
          "$bench" --ci --seconds 2

      - name: Ad-hoc sign macOS bundles
        if: runner.os == 'macOS'
        run: |
          for bundle in "$ARTEFACTS/VST3/$PRODUCT_NAME.vst3" \
                        "$ARTEFACTS/AU/$PRODUCT_NAME.component" \
                        "$ARTEFACTS/Standalone/$PRODUCT_NAME.app" \
                        "$ARTEFACTS2/VST3/$PRODUCT_NAME2.vst3" \
                        "$ARTEFACTS2/AU/$PRODUCT_NAME2.component" \
                        "$ARTEFACTS2/Standalone/$PRODUCT_NAME2.app"; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --verbose "$bundle"
          done

      - name: pluginval (VST3, strictness 10)
        run: |
          case "$RUNNER_OS" in
            Linux)   asset=pluginval_Linux.zip;   exe=./pluginval ;;
            macOS)   asset=pluginval_macOS.zip;   exe=./pluginval.app/Contents/MacOS/pluginval ;;
            Windows) asset=pluginval_Windows.zip; exe=./pluginval.exe ;;
          esac
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/$asset"
          unzip -q pluginval.zip

          runner=""
          if [ "$RUNNER_OS" = "Linux" ]; then runner="xvfb-run -a"; fi

          $runner "$exe" --strictness-level 10 --validate-in-process \
            --validate "$ARTEFACTS/VST3/$PRODUCT_NAME.vst3"
          $runner "$exe" --strictness-level 10 --validate-in-process \
            --validate "$ARTEFACTS2/VST3/$PRODUCT_NAME2.vst3"

      # The validator only changes with the SDK tag, so it is built once per
      # platform and kept in the Actions cache.
      - name: Restore the Steinberg VST3 validator
        id: validator-cache
        uses: actions/cache@v4
        with:
          path: ~/vst3-validator
          key: vst3-validator-${{ runner.os }}-${{ env.VST3_SDK_TAG }}

      - name: Build the Steinberg VST3 validator
        if: steps.validator-cache.outputs.cache-hit != 'true'
        run: |
          # Only the SDK parts the validator needs.
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake

          args=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = Windows ]; then args+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl); fi
          cmake -S "$RUNNER_TEMP/vst3sdk" -B "$RUNNER_TEMP/vst3sdk-build" "${args[@]}" \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_RUN_VST_VALIDATOR=OFF > /dev/null
          cmake --build "$RUNNER_TEMP/vst3sdk-build" --config Release --target validator --parallel 4 > /dev/null
          validator=$(find "$RUNNER_TEMP/vst3sdk-build/bin" -type f \( -name validator -o -name validator.exe \) | head -n 1)
          mkdir -p ~/vst3-validator
          cp "$validator" ~/vst3-validator/

      - name: Steinberg VST3 validator (extensive)
        run: |
          validator=$(find ~/vst3-validator -type f \( -name validator -o -name validator.exe \) | head -n 1)

          runner=""
          if [ "$RUNNER_OS" = "Linux" ]; then runner="xvfb-run -a"; fi

          # Prints errors only; exits non-zero if any test fails.
          $runner "$validator" -e -q "$ARTEFACTS/VST3/$PRODUCT_NAME.vst3"
          $runner "$validator" -e -q "$ARTEFACTS2/VST3/$PRODUCT_NAME2.vst3"

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PRODUCT_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 -u "$(whoami)" AudioComponentRegistrar || true
          auval -a | grep -i octa || true
          auval -strict -v aumu Vsyn Octa
          cp -R "$ARTEFACTS2/AU/$PRODUCT_NAME2.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 -u "$(whoami)" AudioComponentRegistrar || true
          auval -strict -v aumu Oct2 Octa

      - name: Package
        run: |
          mkdir -p dist
          suffix="${{ matrix.name }}"
          cd "$ARTEFACTS"
          case "$RUNNER_OS" in
            macOS)
              # ditto keeps the bundle structure, permissions and signatures intact.
              ditto -c -k --keepParent "VST3/$PRODUCT_NAME.vst3"      "$GITHUB_WORKSPACE/dist/Octavio-VST3-$suffix.zip"
              ditto -c -k --keepParent "AU/$PRODUCT_NAME.component"   "$GITHUB_WORKSPACE/dist/Octavio-AU-$suffix.zip"
              ditto -c -k --keepParent "Standalone/$PRODUCT_NAME.app" "$GITHUB_WORKSPACE/dist/Octavio-Standalone-$suffix.zip"
              ;;
            Linux)
              (cd VST3 && zip -qry "$GITHUB_WORKSPACE/dist/Octavio-VST3-$suffix.zip" "$PRODUCT_NAME.vst3")
              (cd Standalone && zip -qy "$GITHUB_WORKSPACE/dist/Octavio-Standalone-$suffix.zip" "$PRODUCT_NAME")
              ;;
            Windows)
              (cd VST3 && 7z a -bso0 "$GITHUB_WORKSPACE/dist/Octavio-VST3-$suffix.zip" "$PRODUCT_NAME.vst3")
              (cd Standalone && 7z a -bso0 "$GITHUB_WORKSPACE/dist/Octavio-Standalone-$suffix.zip" "$PRODUCT_NAME.exe")
              # The benchmark, to run on the reference PC (docs/PHASE7.md, step 7.0).
              (cd "$GITHUB_WORKSPACE/$BUILD_DIR/tests" && 7z a -bso0 "$GITHUB_WORKSPACE/dist/ViolinSynthBench-$suffix.zip" ViolinSynthBench.exe)
              ;;
          esac
          # Octavio 2, named Octavio2-* so 1.x releases (Octavio-*.zip) leave it out until it ships
          cd "$GITHUB_WORKSPACE/$ARTEFACTS2"
          case "$RUNNER_OS" in
            macOS)
              ditto -c -k --keepParent "VST3/$PRODUCT_NAME2.vst3"      "$GITHUB_WORKSPACE/dist/Octavio2-VST3-$suffix.zip"
              ditto -c -k --keepParent "AU/$PRODUCT_NAME2.component"   "$GITHUB_WORKSPACE/dist/Octavio2-AU-$suffix.zip"
              ditto -c -k --keepParent "Standalone/$PRODUCT_NAME2.app" "$GITHUB_WORKSPACE/dist/Octavio2-Standalone-$suffix.zip"
              ;;
            Linux)
              (cd VST3 && zip -qry "$GITHUB_WORKSPACE/dist/Octavio2-VST3-$suffix.zip" "$PRODUCT_NAME2.vst3")
              (cd Standalone && zip -qy "$GITHUB_WORKSPACE/dist/Octavio2-Standalone-$suffix.zip" "$PRODUCT_NAME2")
              ;;
            Windows)
              (cd VST3 && 7z a -bso0 "$GITHUB_WORKSPACE/dist/Octavio2-VST3-$suffix.zip" "$PRODUCT_NAME2.vst3")
              (cd Standalone && 7z a -bso0 "$GITHUB_WORKSPACE/dist/Octavio2-Standalone-$suffix.zip" "$PRODUCT_NAME2.exe")
              ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Octavio-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Compile cache statistics
        if: always()
        run: sccache --show-stats

  # A release publishes a GitHub Release with the plugin zips from every
  # platform, once all the checks above have passed. It starts either from a
  # pushed version tag (v1.0.0), or from a run started by hand on main with
  # "release" ticked, which tags the commit v<version in CMakeLists.txt>. The
  # notes come from docs/releases/<tag>.md when that file exists.
  release:
    needs: [build, format, research, rtsan]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    name: Publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: Octavio-*
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            # Octavio 2 is the product released from 2.0 on; Octavio 1 stays at its last release
            version=$(sed -nE 's/^ *VERSION ([0-9.]+)$/\1/p' octavio2/CMakeLists.txt | head -1)
            [ -n "$version" ] || { echo "No version in octavio2/CMakeLists.txt"; exit 1; }
            tag="v$version"
          fi
          # v1.x tags ship Octavio 1, v2.x and later Octavio 2
          if [[ "$tag" == v1.* ]]; then zips=(dist/Octavio-*.zip); else zips=(dist/Octavio2-*.zip); fi
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          ls -la dist

          if gh release view "$tag" > /dev/null 2>&1; then
            # Made by hand on GitHub first: just attach the plugins.
            gh release upload "$tag" "${zips[@]}" --clobber
          else
            # Creates the tag on this commit when it does not exist yet.
            gh release create "$tag" "${zips[@]}" --target "$GITHUB_SHA" --title "Octavio ${tag#v}" "${notes_args[@]}"
          fi
