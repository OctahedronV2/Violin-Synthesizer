name: Build

# The repository is public, so GitHub-hosted runners are free: every push
# builds and tests Linux, macOS and Windows. Each push runs once (branch
# pushes also report on their PRs); pull requests from forks, which have no
# push run here, run via pull_request. A newer push to a branch cancels its
# older run, and Markdown-only changes skip CI.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUILD_TYPE: Release
  BUILD_DIR: build
  PLUGINVAL_VERSION: v1.0.4
  VST3_SDK_TAG: v3.8.1_build_84
  ARTEFACTS: build/ViolinSynth_artefacts/Release
  PRODUCT_NAME: Violin Synthesizer

jobs:
  format:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          clang-format-18 --version
          git ls-files '*.h' '*.cpp' | xargs clang-format-18 --dry-run --Werror

  research:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Research model tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  rtsan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: RealtimeSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Clang 20 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-20 libclang-rt-20-dev ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DVIOLINSYNTH_ENABLE_RTSAN=ON

      - name: Build tests
        run: cmake --build "$BUILD_DIR" --target ViolinSynthTests --parallel 4

      # processBlock and the engine are marked nonblocking: any allocation,
      # lock or system call reached from them stops the run with a stack trace.
      - name: Tests under RealtimeSanitizer
        run: "$BUILD_DIR/tests/ViolinSynthTests"

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb valgrind \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        run: |
          case "$RUNNER_OS" in
            Linux)   args=(-G Ninja) ;;
            macOS)   args=(-G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
            Windows) args=(-A x64) ;;
          esac
          cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" "${args[@]}"

      - name: Build
        run: cmake --build "$BUILD_DIR" --config "$BUILD_TYPE" --parallel 4

      - name: Unit tests
        run: ctest --test-dir "$BUILD_DIR" --build-config "$BUILD_TYPE" --output-on-failure

      # docs/PHASE7.md, step 7.0. Timings on shared runners are only a rough
      # guide, so this step never fails; the Callgrind step below is the check.
      - name: Benchmarks (timings, for information)
        run: |
          bench=$(find "$BUILD_DIR/tests" -name 'ViolinSynthBench' -o -name 'ViolinSynthBench.exe' | head -n 1)
          "$bench" --ci --seconds 2

      - name: Benchmarks (instruction counts against the baseline)
        if: runner.os == 'Linux'
        run: |
          mkdir -p callgrind
          valgrind --tool=callgrind --instr-atstart=no --callgrind-out-file=callgrind/callgrind.out.%p \
            "$BUILD_DIR/tests/ViolinSynthBench" --ci --seconds 1 --json callgrind/bench.json > callgrind/run.log 2>&1 \
            || { cat callgrind/run.log; exit 1; }
          python3 tests/bench/instructions.py callgrind

      - name: Ad-hoc sign macOS bundles
        if: runner.os == 'macOS'
        run: |
          for bundle in "$ARTEFACTS/VST3/$PRODUCT_NAME.vst3" \
                        "$ARTEFACTS/AU/$PRODUCT_NAME.component" \
                        "$ARTEFACTS/Standalone/$PRODUCT_NAME.app"; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --verbose "$bundle"
          done

      - name: pluginval (VST3, strictness 10)
        run: |
          case "$RUNNER_OS" in
            Linux)   asset=pluginval_Linux.zip;   exe=./pluginval ;;
            macOS)   asset=pluginval_macOS.zip;   exe=./pluginval.app/Contents/MacOS/pluginval ;;
            Windows) asset=pluginval_Windows.zip; exe=./pluginval.exe ;;
          esac
          curl -fsSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/$asset"
          unzip -q pluginval.zip

          runner=""
          if [ "$RUNNER_OS" = "Linux" ]; then runner="xvfb-run -a"; fi

          $runner "$exe" --strictness-level 10 --validate-in-process \
            --validate "$ARTEFACTS/VST3/$PRODUCT_NAME.vst3"

      - name: Steinberg VST3 validator (extensive)
        run: |
          # Only the SDK parts the validator needs; it builds in under a minute.
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" submodule update -q --init --depth 1 base pluginterfaces public.sdk cmake

          case "$RUNNER_OS" in
            Windows) args=(-A x64) ;;
            *)       args=(-G Ninja -DCMAKE_BUILD_TYPE=Release) ;;
          esac
          cmake -S "$RUNNER_TEMP/vst3sdk" -B "$RUNNER_TEMP/vst3sdk-build" "${args[@]}" \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_RUN_VST_VALIDATOR=OFF > /dev/null
          cmake --build "$RUNNER_TEMP/vst3sdk-build" --config Release --target validator --parallel 4 > /dev/null
          validator=$(find "$RUNNER_TEMP/vst3sdk-build/bin" -type f \( -name validator -o -name validator.exe \) | head -n 1)

          runner=""
          if [ "$RUNNER_OS" = "Linux" ]; then runner="xvfb-run -a"; fi

          # Prints errors only; exits non-zero if any test fails.
          $runner "$validator" -e -q "$ARTEFACTS/VST3/$PRODUCT_NAME.vst3"

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ARTEFACTS/AU/$PRODUCT_NAME.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 -u "$(whoami)" AudioComponentRegistrar || true
          auval -a | grep -i octa || true
          auval -strict -v aumu Vsyn Octa

      - name: Package
        run: |
          mkdir -p dist
          suffix="${{ matrix.name }}"
          cd "$ARTEFACTS"
          case "$RUNNER_OS" in
            macOS)
              # ditto keeps the bundle structure, permissions and signatures intact.
              ditto -c -k --keepParent "VST3/$PRODUCT_NAME.vst3"      "$GITHUB_WORKSPACE/dist/ViolinSynth-VST3-$suffix.zip"
              ditto -c -k --keepParent "AU/$PRODUCT_NAME.component"   "$GITHUB_WORKSPACE/dist/ViolinSynth-AU-$suffix.zip"
              ditto -c -k --keepParent "Standalone/$PRODUCT_NAME.app" "$GITHUB_WORKSPACE/dist/ViolinSynth-Standalone-$suffix.zip"
              ;;
            Linux)
              (cd VST3 && zip -qry "$GITHUB_WORKSPACE/dist/ViolinSynth-VST3-$suffix.zip" "$PRODUCT_NAME.vst3")
              (cd Standalone && zip -qy "$GITHUB_WORKSPACE/dist/ViolinSynth-Standalone-$suffix.zip" "$PRODUCT_NAME")
              ;;
            Windows)
              (cd VST3 && 7z a -bso0 "$GITHUB_WORKSPACE/dist/ViolinSynth-VST3-$suffix.zip" "$PRODUCT_NAME.vst3")
              (cd Standalone && 7z a -bso0 "$GITHUB_WORKSPACE/dist/ViolinSynth-Standalone-$suffix.zip" "$PRODUCT_NAME.exe")
              # The benchmark, to run on the reference PC (docs/PHASE7.md, step 7.0).
              (cd "$GITHUB_WORKSPACE/$BUILD_DIR/tests/$BUILD_TYPE" && 7z a -bso0 "$GITHUB_WORKSPACE/dist/ViolinSynthBench-$suffix.zip" ViolinSynthBench.exe)
              ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ViolinSynth-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
